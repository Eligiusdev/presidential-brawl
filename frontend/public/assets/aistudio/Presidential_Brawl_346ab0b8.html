 ui.style.display='flex';ui.style.background='';ui.innerHTML=`<h1>⏸ PAUSA</h1><div style='display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%'>${F.map(g).join('')}</div><p class=s>Teclado J1: A/D mover · W saltar · S bajar · J ligero · K signature · L esquive · C/Espacio ultimate &nbsp;|&nbsp; J2: flechas · U/I/O · M/Enter ultimate<br>Mando: stick/cruceta mover · A/Y saltar · X ligero · B signature · LB/RB esquive · LT/RT ultimate · Start pausa<br>Esquivar un Ultimate: haz Dash justo cuando su impacto te alcanza = ¡ESQUIVE PERFECTO! (+20% Voto Popular)</p><div><button id=rs>▶ Reanudar Combate</button><button id=rt>🔄 Reiniciar Pelea</button><button id=ex>🏠 Salir al Menú Principal</button></div>`;
 ui.onclick=e=>{const b=e.target.closest('button');if(!b)return;A.init();if(b.id=='rs')togglePause();else if(b.id=='rt'){paused=false;campaignState?startRound():start()}else if(b.id=='ex'){paused=false;showSelect()}}}
// ---------- Pantallas ----------
function showSelect(){state='sel';F=[];campaignState=null;HC=1200;clearTimeout(vsT);ui.style.display='flex';ui.style.background='';
 const row=n=>`<h3>Jugador ${n+1}${n?(vsAI?' (IA)':' (Humano)'):''}</h3><div class=g>${R.map((d,k)=>`<button class="c${sel[n]==k?' on':''}" data-p="${n}" data-k="${k}"><i style="background:${d.c.body};border-color:${d.c.acc}"></i><b>${d.name}</b><small>${d.role}</small><small>★ ${d.sigName}</small></button>`).join('')}</div>`;
 ui.innerHTML=`<h1>PRESIDENTIAL BRAWL</h1><p class=s>J1: A/D mover · W saltar (x3) · S caída rápida/bajar · J ligero · K signature · L esquive &nbsp;|&nbsp; J2: flechas · U/I/O (o Numpad 1/2/3). Esquive+Ataque lanza el arma. ULTIMATE con Voto Popular al 100%: J1 C / J+K / Espacio · J2 M / U+I / Enter / Numpad 0. Agarra paredes para el wall-jump.</p>${row(0)}${row(1)}<h3>Escenario</h3><div class=g>${['La Casa Blanca','Casa de Nariño','La Casa Rosada','Aleatorio'].map((n,k)=>`<button class="c${stageSel==k?' on':''}" data-s="${k}"><b>${n}</b><small>${k<3?STAGES_DATA[k].hz.name:'Sorpresa'}</small></button>`).join('')}</div><div><button id=tg>Jugador 2: ${vsAI?'IA Competitiva':'Humano (Local)'}</button><button id=go>¡PELEAR!</button></div><div><button id=cm>★ MODO CUMBRE MUNDIAL (Campaña 1P) ★</button></div>${installEv?'<div><button id=ins>📲 Instalar como App</button></div>':(isIOS&&!standalone?'<p class=s>iOS: Compartir ▸ «Añadir a pantalla de inicio» para instalar como app</p>':'')}`;
 ui.onclick=e=>{const b=e.target.closest('button');if(!b)return;A.init();if(b.dataset.p){sel[+b.dataset.p]=+b.dataset.k;showSelect()}else if(b.dataset.s){stageSel=+b.dataset.s;if(stageSel<3)setStage(stageSel);showSelect()}else if(b.id=='tg'){vsAI=!vsAI;showSelect()}else if(b.id=='go')start();else if(b.id=='cm')startCampaign();else if(b.id=='ins'&&installEv){installEv.prompt();installEv=null;showSelect()}}}
function showOver(w){state='over';ui.style.display='flex';ui.style.background='';ui.innerHTML=`<h1>PRESIDENTE ELECTO:<br>${w.d.name.toUpperCase()}</h1><div><button id=rv>Revancha</button><button id=ch>Cambiar Personajes</button></div>`;
 ui.onclick=e=>{const b=e.target.closest('button');if(!b)return;A.init();if(b.id=='rv')start();else if(b.id=='ch')showSelect()}}
function start(){campaignState=null;HC=1200;setStage(stageSel==3?Math.floor(Math.random()*3):stageSel);F=[new Fighter(0,R[sel[0]],false),new Fighter(1,R[sel[1]],vsAI)];PR=[];IT=[];PA=[];UL=[];cine=null;T=0;freeze=0;shake=0;winner=null;state='play';ui.style.display='none'}
setStage(0);showSelect();requestAnimationFrame(loop);
</script></body></html>
