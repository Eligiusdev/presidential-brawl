name: Presidential Brawl Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false

      - name: Validate and build the Wasm engine
        run: |
          bash scripts/check-rollback-parity.sh
          bash scripts/check-rollback-network.sh
          mkdir -p frontend/public/sim
          (cd engine && GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -o ../frontend/public/sim/sim.wasm ./cmd/sim-wasm)
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" frontend/public/sim/
          jq -n --arg version "$GITHUB_SHA" \
            --arg sha256 "$(sha256sum frontend/public/sim/sim.wasm | cut -d ' ' -f1)" \
            --argjson bytes "$(wc -c < frontend/public/sim/sim.wasm)" \
            '{version: $version, sha256: $sha256, bytes: $bytes}' > frontend/public/sim/manifest.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies from lockfile
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build game for GitHub Pages
        env:
          VITE_WASM_VERSION: ${{ github.sha }}
          VITE_ROOM_API_BASE_URL: ${{ vars.ROOM_API_BASE_URL || 'https://presidential-brawl-api.onrender.com' }}
        run: npm run build --prefix frontend -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Check production entrypoint
        shell: bash
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          if grep -q '/src/main.tsx' frontend/dist/index.html; then
            echo "::error::Production HTML still points to uncompiled TypeScript"
            exit 1
          fi

      - name: Upload compiled game
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # The repository also has a legacy branch publisher. Publish after it so
      # it cannot replace the compiled app with the uncompiled source tree.
      - name: Wait for legacy Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100
              });
              const legacy = data.workflow_runs.filter(run =>
                run.id !== context.runId &&
                run.path === 'dynamic/pages/pages-build-deployment'
              );
              if (legacy.length && legacy.every(run => run.status === 'completed')) {
                core.info('Legacy publisher finished; deploying the compiled game last.');
                return;
              }
              // New Actions-only configurations no longer create a legacy run.
              if (!legacy.length && attempt >= 6) return;
              await pause(5000);
            }
            core.setFailed('Legacy publisher is still running. Retry this workflow after it finishes.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Wasm binary
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          bash scripts/verify-pages-wasm.sh "$PAGES_URL" frontend/dist/sim/manifest.json
