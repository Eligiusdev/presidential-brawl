name: Validate Wasm render bridge
on:
  push:
    branches: [mejora/pixi-combate-experimental]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - run: npm ci --prefix frontend
      - run: go test ./...
        working-directory: engine
      - run: bash scripts/check-rollback-parity.sh
      - run: go build -o ../server-bin ./cmd/server
        working-directory: backend
      - run: |
          mkdir -p frontend/public/sim
          (cd engine && GOOS=js GOARCH=wasm go build -o ../frontend/public/sim/sim.wasm ./cmd/sim-wasm)
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" frontend/public/sim/
          node --experimental-transform-types scripts/check-wasm-render-growth.mjs
          npm --prefix frontend test
          npm --prefix frontend run build
